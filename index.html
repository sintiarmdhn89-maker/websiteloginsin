
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- BAGIAN LOGIN -->
        <div class="form-box login">
            <form id="loginForm">
                <h1>Welcome Back!</h1>
                <p>Silakan masuk ke akun Anda</p>

                <div class="input-box">
                    <input type="email"
                           placeholder="Email Address"
                           required>
                </div>

                <div class="input-box">
                    <input type="password"
                           placeholder="Password"
                           required>
                </div>

                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

                <p class="switch-text">
                    Belum punya akun?
                    <a href="#" id="showRegister">Register</a>
                </p>
            </form>
        </div>

        <!-- BAGIAN REGISTER -->
        <div class="form-box register">
            <form id="registerForm">
                <h1>Create Account</h1>
                <p>Daftar untuk membuat akun baru</p>

                <div class="input-box">
                    <input type="text"
                           placeholder="Full Name"
                           required>
                </div>

                <div class="input-box">
                    <input type="email"
                           placeholder="Email Address"
                           required>
                </div>

                <div class="input-box">
                    <input type="password"
                           placeholder="Create Password"
                           minlength="8"
                           required>
                </div>

                <div class="input-box">
                    <input type="password"
                           placeholder="Confirm Password"
                           minlength="8"
                           required>
                </div>

                <button type="submit" class="btn">
                    Register
                </button>

                <p class="switch-text">
                    Sudah punya akun?
                    <a href="#" id="showLogin">Login</a>
                </p>
            </form>
        </div>

        <!-- PANEL SAMPING -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h2>Hello, Welcome!</h2>
                <p>Belum memiliki akun?</p>
                <button class="btn outline-btn"
                        id="registerButton">
                    Register
                </button>
            </div>

            <div class="toggle-panel toggle-right">
                <h2>Welcome Back!</h2>
                <p>Sudah memiliki akun?</p>
                <button class="btn outline-btn"
                        id="loginButton">
                    Login
                </button>
            </div>
        </div>

    </div>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>

</body>
</html>
