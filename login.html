
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        /* BACKGROUND */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #4158D0,
                #764ba2,
                #C850C0
            );
            padding: 20px;
        }

        /* LOGIN CARD */
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            animation: fadeIn 0.8s ease;
        }

        /* ANIMATION */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* HEADING */
        .login-container h1 {
            text-align: center;
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* INPUT */
        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            margin-bottom: 9px;
            color: #444;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f8f8fc;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118,75,162,0.2);
            background: white;
        }

        /* OPTIONS */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 25px;
            gap: 10px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555;
        }

        .options a {
            color: #764ba2;
            text-decoration: none;
        }

        /* BUTTON */
        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                #4158D0,
                #764ba2
            );
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(118,75,162,0.3);
        }

        /* REGISTER */
        .register {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }

        .register a {
            color: #764ba2;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover,
        .options a:hover {
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .login-container {
                padding: 35px 23px;
            }

            .login-container h1 {
                font-size: 27px;
            }

            .options {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Welcome Back!</h1>

        <p>Silakan login untuk melanjutkan</p>

        <form onsubmit="login(event)">

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    placeholder="Masukkan email kamu"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    placeholder="Masukkan password"
                    required
                >
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register">
            Belum punya akun?
            <a href="#">Register</a>
        </div>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            alert("Form login berhasil dikirim!");
        }
    </script>

</body>
</html>
